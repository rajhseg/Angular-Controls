
<div [id]="Id" class="carousel" [ngStyle]="{ 'margin-right': '10px', '--width': Width , '--cheight': ContainerHeight, 
    '--height': ItemHeight, '--bcolor': SlideButtonsColor,
    '--borcolor': BorderColor, 'border-right': 'none',
    'pointer-events': (IsReadOnly || IsDisabled) ? 'none': '', 'user-select': IsDisabled ? 'none': 'auto' }">

    <div class="sds" #cvslides [id]="_slidesId">
        
        <div [ngStyle]="{ 'height': ItemHeight, 'width': ItemWidth}">
            <img [src]="LastElement.src" class="clone" [ngStyle]="{ 'height': ItemHeight, 'width': ItemWidth}" />
        </div>

        <div *ngFor="let img of Images; trackBy: trackById"  
            [ngStyle]="{ 'height': ItemHeight, 'width': ItemWidth}">
            <img [src]="img.element.nativeElement.src" [ngStyle]="{ 'height': ItemHeight, 'width': ItemWidth}">
        </div>
        
        <div [ngStyle]="{ 'height': ItemHeight, 'width': ItemWidth}">
            <img [src]="FirstElement.src" class="clone" [ngStyle]="{ 'height': ItemHeight, 'width': ItemWidth}" />
        </div>

    </div>

    <button class="prev">❮</button>
    <button class="next">❯</button>
</div>
